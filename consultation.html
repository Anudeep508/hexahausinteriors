<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Consultation | HEXAHAUS</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <nav>
    <div class="logo">HEXA<span>HAUS</span></div>

    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/services">Services</a></li>
      <li><a href="/portfolio">Portfolio</a></li>
      <li><a href="/consultation">Consultation</a></li>
    </ul>
  </nav>

  <section class="section">

    <h1>Book Consultation</h1>

    <p>
      Tell us about your dream space and our team will connect with you shortly.
    </p>

    <br><br>

    <form
      name="consultation"
      method="POST"
      data-netlify="true"
      action="/thankyou.html"
    >

      <!-- Required Hidden Input -->
      <input type="hidden" name="form-name" value="consultation">

      <input
        type="text"
        name="First Name"
        placeholder="First Name"
        required
      >

      <input
        type="text"
        name="Last Name"
        placeholder="Last Name"
        required
      >

      <input
        type="email"
        name="Email"
        placeholder="Email Address"
        required
      >

      <input
        type="tel"
        name="Phone"
        placeholder="Phone Number"
        required
      >

      <select name="Project Type" required>
        <option value="">Select Project Type</option>
        <option>Residential Design</option>
        <option>Commercial Interiors</option>
        <option>Luxury Villa</option>
        <option>Office Interiors</option>
        <option>Modular Kitchen</option>
      </select>

      <textarea
        name="Message"
        rows="6"
        placeholder="Tell us about your project"
        required
      ></textarea>

      <button type="submit" class="btn">
        Submit Consultation
      </button>

    </form>

  </section>

  <footer>
    <h3>HEXAHAUS Interiors</h3>

    <p>
      Where Bespoke Design Meets Precision Engineering
    </p>

    <p>
      hello@hexahausinteriors.co.in
    </p>
  </footer>

</body>
</html>
